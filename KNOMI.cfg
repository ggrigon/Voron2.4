# KNOMI status macros. The KNOMI1 runs the DiverOfDark firmware v2.5.0
# (github.com/DiverOfDark/KNOMI, flashed over USB 2026-09-19). GIFs are swapped from
# its web UI at http://192.168.1.214, no reflash needed.
#
# Based on https://github.com/bigtreetech/KNOMI/blob/master/KNOMI.cfg. The firmware's
# own knomi.cfg is not used: its QUAD_GANTRY_LEVEL drops {rawparams}, which would
# silently turn QGL_LOW (RETRY_TOLERANCE=0.2) into a fine QGL. input_shaping is unused
# by this firmware (it came from the Zero G fork) and harmless.
#
# The firmware reads gcode_macro _KNOMI_STATUS over the Moonraker websocket; these
# wrappers set its variables.
# Nothing else in this config may redefine G28, M109, M190, BED_MESH_CALIBRATE,
# QUAD_GANTRY_LEVEL or SHAPER_CALIBRATE (e.g. KAMP/Adaptive_Meshing.cfg must stay disabled).

[gcode_macro _KNOMI_STATUS]
variable_homing: False
variable_probing: False
variable_qgling: False
variable_heating_nozzle: False
variable_heating_bed: False
variable_input_shaping: False
gcode:

[gcode_macro M109]
rename_existing: M109.1
gcode:
  SET_GCODE_VARIABLE MACRO=_KNOMI_STATUS VARIABLE=heating_nozzle VALUE=True
  M109.1 {rawparams}
  SET_GCODE_VARIABLE MACRO=_KNOMI_STATUS VARIABLE=heating_nozzle VALUE=False

[gcode_macro M190]
rename_existing: M190.1
gcode:
  SET_GCODE_VARIABLE MACRO=_KNOMI_STATUS VARIABLE=heating_bed VALUE=True
  M190.1 {rawparams}
  SET_GCODE_VARIABLE MACRO=_KNOMI_STATUS VARIABLE=heating_bed VALUE=False

[gcode_macro G28]
rename_existing: G28.1
gcode:
  SET_GCODE_VARIABLE MACRO=_KNOMI_STATUS VARIABLE=homing VALUE=True
  G28.1 {rawparams}
  SET_GCODE_VARIABLE MACRO=_KNOMI_STATUS VARIABLE=homing VALUE=False

[gcode_macro BED_MESH_CALIBRATE]
rename_existing: BTT_BED_MESH_CALIBRATE
gcode:
  SET_GCODE_VARIABLE MACRO=_KNOMI_STATUS VARIABLE=probing VALUE=True
  BTT_BED_MESH_CALIBRATE {rawparams}
  SET_GCODE_VARIABLE MACRO=_KNOMI_STATUS VARIABLE=probing VALUE=False

# For printer with QGL
[gcode_macro QUAD_GANTRY_LEVEL]
rename_existing: BTT_QUAD_GANTRY_LEVEL
gcode:
  SET_GCODE_VARIABLE MACRO=_KNOMI_STATUS VARIABLE=qgling VALUE=True
  BTT_QUAD_GANTRY_LEVEL {rawparams}
  SET_GCODE_VARIABLE MACRO=_KNOMI_STATUS VARIABLE=qgling VALUE=False

[gcode_macro SHAPER_CALIBRATE]
rename_existing: BTT_SHAPER_CALIBRATE
gcode:
  SET_GCODE_VARIABLE MACRO=_KNOMI_STATUS VARIABLE=input_shaping VALUE=True
  BTT_SHAPER_CALIBRATE {rawparams}
  SET_GCODE_VARIABLE MACRO=_KNOMI_STATUS VARIABLE=input_shaping VALUE=False

